<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ante — regulatory early warning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ------------------------------------------------------------------
   Ante — the founder's board.

   A broadsheet, not a dashboard. The type carries the hierarchy, the
   numbers are the headline, and colour is a scalpel: #aa0b56 means
   "already in force / unbudgeted" and appears nowhere else.

   Every figure rendered here arrives from /api/*, which reads the local
   markdown vault. Nothing is hardcoded; if a number is on this page it
   is in a file on this machine, and one click away from its .gov.sg
   source.
   ------------------------------------------------------------------ */
:root{
  --bg:#f3f2f2; --ink:#201e1d; --muted:#605d5d; --faint:#7d7979;
  --line:#d7d3d3; --hair:#eae7e7; --panel:#f8f4f4; --band:#eae9e9;
  --link:#006786; --link-u:#99e0ff; --link-h:#0a303e; --cyan:#0088b0;
  --alarm:#d6006c; --alarm-ink:#aa0b56; --alarm-deep:#79103d;
  --alarm-bg:#fff1f4; --alarm-hi:#ffdee6;
  --serif:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
     -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--link);text-decoration:none;border-bottom:1px solid var(--link-u)}
a:hover{color:var(--link-h);border-bottom-color:var(--cyan)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
input,select,button,textarea{font-family:inherit}
button{cursor:pointer;border-radius:2px}
h1,h2,h3{font-weight:400;letter-spacing:-.01em;margin:0}
p{text-wrap:pretty}

.wrap{max-width:1320px;padding:0 clamp(24px,6vw,120px) 160px}
.mono{font-family:var(--mono)}
/* small uppercase mono label — the section eyebrow used throughout */
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.kick{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.meta{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--faint)}
.sec{margin-top:112px}
.sechead{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;justify-content:space-between}
.sechead h2{font-size:26px}
.lede{font-size:17px;color:var(--muted);max-width:60ch}
.rule-row{display:grid;grid-template-columns:120px minmax(0,1fr) 210px;gap:12px 36px}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:13px 24px;font-size:16px}
.btn:hover{background:#444141}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:13px 24px;font-size:16px}
.btn-ghost:hover{border-color:var(--cyan);color:var(--link)}
.chip{background:transparent;border:1px solid var(--line);padding:7px 14px;font-family:var(--mono);
      font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chip:hover{border-color:var(--cyan);color:var(--link)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.field{width:100%;margin-top:9px;font-size:18px;padding:12px 14px;border:1px solid var(--line);
       background:var(--panel);color:var(--ink);border-radius:2px}
.field:focus{border-color:var(--cyan);outline:2px solid var(--cyan);outline-offset:2px}
.hint{font-size:15px;color:var(--faint);margin-top:7px;line-height:1.5}
.quote{background:var(--band);padding:30px clamp(20px,3vw,38px)}
.hl{background:var(--alarm-hi);padding:1px 4px}
.drawer-bg{position:fixed;inset:0;background:rgba(32,30,29,.32);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,94vw);background:var(--bg);z-index:41;
        overflow:auto;box-shadow:0 12px 32px rgba(45,43,43,.22);animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
      border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){
  .rule-row{grid-template-columns:1fr;gap:10px}
  .rule-row .fig{text-align:left !important}
  .sec{margin-top:76px}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div style="padding:120px 0"><span class="spin"></span> <span class="meta">READING THE VAULT</span></div>
</div>

<script>
"use strict";
/* ---------------------------------------------------------------- helpers */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => "S$" + Number(n).toLocaleString("en-SG", { maximumFractionDigits: 0 });
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return "gov.sg"; } };
const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
function longDate(iso) {
  if (!iso) return null;
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? iso : `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function shortDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? iso
    : `${String(d.getDate()).padStart(2,"0")} ${MONTHS[d.getMonth()].slice(0,3).toUpperCase()} ${d.getFullYear()}`;
}
const ago = d => d == null ? "never" : d === 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`;

/* Alert bodies are markdown written for Obsidian, so they carry [text](path)
   links, backticks and full government URLs. Rendered raw they read as source
   code in the one section whose whole job is to look trustworthy. */
const plain = s => String(s ?? "")
  .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
  .replace(/`([^`]*)`/g, "$1")
  .replace(/\*\*([^*]+)\*\*/g, "$1")
  .replace(/https?:\/\/(?:www\.)?([^\s/]+)\S*/g, "$1")
  .replace(/\s*\n\s*/g, " ")
  .trim();

const CLOCK = { law: "Law moved", growth: "You grew", recurring: "Date arriving" };
const UNIT = { SGD_per_month: "/mo", SGD_per_year: "/yr", percent: "%", months: " months" };

const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(body.detail || r.statusText), { status: r.status, body });
  return body;
};

/* ---------------------------------------------------------------- state */
const S = { health: null, findings: null, rules: null, alerts: null, changed: null,
            filter: "all", open: null, asked: null, asking: false, upload: null, busy: "" };

/* Join the free board data (/api/findings) to the human-written prose and the
   three freshness clocks (/api/rules). Kept as one derived shape so every
   renderer below reads the same row. */
function rows() {
  if (!S.findings || !S.rules) return [];
  const byPath = Object.fromEntries(S.rules.rules.map(r => [r.path, r]));
  const alertFor = p => (S.alerts?.alerts || []).find(a => a.rule === p);
  return S.findings.rules.map(f => {
    const meta = byPath[f.path] || {};
    const fresh = meta.freshness || {};
    const gap = f.affected.reduce((t, a) => t + (a.annual_gap || 0), 0);
    const when = f.in_force ? `−${Math.abs(f.days_until)}d`
               : f.days_until == null ? "standing" : `+${f.days_until}d`;
    return {
      ...f, slug: meta.slug, when, clockLabel: CLOCK[f.clock] || f.clock,
      cost: meta.cost || "", next: meta.next_step || "",
      verified: fresh.verified, checked: fresh.checked, confirmed: fresh.confirmed,
      overdue: !!meta.overdue_human_review, alert: alertFor(f.path),
      revision: meta.revision, lastChange: meta.last_change,
      gap, figure: gap ? money(gap) : "quoted",
      figureNote: gap ? "a year · from your payroll" : "priced in the rule note",
      consequence: consequence(f),
    };
  });
}

/* One plain sentence per finding, composed from the vault's own numbers.
   Deliberately mechanical: it states the comparison and the date, and it never
   reaches for a figure the vault does not hold. */
function consequence(f) {
  const u = UNIT[f.unit] || "";
  const when = f.in_force
    ? `In force since ${longDate(f.lands)}.`
    : f.lands ? `Lands ${longDate(f.lands)}.` : "A standing threshold, with no date.";
  const who = f.affected.map(a => {
    const v = f.unit && f.unit.startsWith("SGD") ? money(a.value) : a.value;
    const t = f.unit && f.unit.startsWith("SGD") ? money(f.threshold_after) : f.threshold_after;
    if (f.bites === "below") return `${a.who} is on ${v}${u}, short of the ${t}${u} floor`;
    if (f.bites === "above") return `${a.who} is on ${v}${u}, above the old ${money(f.threshold_before)} ceiling`;
    if (f.bites === "forecast") return `${a.who} is at ${v}${u} against a ${t}${u} threshold`;
    if (f.bites === "band") return `${a.who} sits in the affected band`;
    return `${a.who} is in scope`;
  }).join("; ");
  return `${when} ${who}.`;
}

/* The provenance chain, built only from dates the vault actually carries.
   `verified` is a person's claim and `checked`/`confirmed` are the machine's;
   they are listed as separate links precisely so a daily bot sweep can never
   read as a human having re-read the law. */
function chain(r) {
  const c = [{ ok: true, text: `Figure printed on ${host(r.resource)}` }];
  c.push(r.verified?.on
    ? { ok: true, text: `Read by a person on ${longDate(r.verified.on)}` }
    : { ok: false, text: "Never read by a person" });
  c.push(r.checked?.on
    ? { ok: true, text: `Machine re-read ${ago(r.checked.days)}` }
    : { ok: false, text: "Not yet machine-checked" });
  if (r.alert)
    c.push({ ok: false, text: `Escalated to a human on ${longDate(r.alert.raised)} — ${r.alert.drift}, still open` });
  else if (r.confirmed?.on)
    c.push({ ok: true, text: `Figure confirmed present ${ago(r.confirmed.days)}` });
  if (r.overdue) c.push({ ok: false, text: "Human re-read overdue (>365 days)" });
  return c;
}

/* ---------------------------------------------------------------- headline */
function headline() {
  const list = rows();
  if (!list.length)
    return `Nothing bites right now. ${S.findings?.rules_with_exposure ?? 0} rules checked, and not one of them touches this company today.`;
  const gapRows = list.filter(r => r.gap);
  const forced = list.filter(r => r.in_force);
  const bits = [];
  if (gapRows.length) {
    const names = gapRows.flatMap(r => r.affected.map(a => a.who));
    const total = gapRows.reduce((t, r) => t + r.gap, 0);
    const lands = gapRows.map(r => r.lands).filter(Boolean).sort()[0];
    bits.push(`${andList(names)} ${names.length > 1 ? "are" : "is"} <span class="mono" style="font-size:.86em;letter-spacing:-.01em">${money(total)}</span> a year under thresholds${lands ? ` that land on ${longDate(lands)}` : ""}`);
  }
  if (forced.length) {
    const f = forced[0];
    bits.push(`${andList(f.affected.map(a => a.who))} ${f.affected.length > 1 ? "have" : "has"} been over the ${shortTitle(f.title)} for <span style="color:var(--alarm-ink)">${Math.abs(f.days_until)} days</span>`);
  }
  if (!bits.length)
    bits.push(`${list.length} obligations touch this company, priced in the cost note on each rule`);
  return bits.join(", and ") + ".";
}
const andList = a => a.length <= 1 ? (a[0] || "")
  : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
const shortTitle = t => t.replace(/\s+(rises?|rose|becomes?|due)\b.*$/i, "").trim();

/* ---------------------------------------------------------------- render */
function render() {
  const list = rows();
  const shown = S.filter === "all" ? list
    : S.filter === "force" ? list.filter(r => r.in_force)
    : list.filter(r => r.clock === S.filter);
  const forced = list.filter(r => r.in_force);
  const h = S.health || {};
  const sweep = (h.last_sweep || "").toUpperCase();
  const degraded = h.bedrock && h.bedrock.alive === false;

  $("#app").innerHTML = `
  <div style="display:flex;flex-wrap:wrap;gap:20px 48px;align-items:baseline;padding:52px 0 0">
    <div style="font-size:19px;letter-spacing:.02em">Ante</div>
    <div class="mono" style="font-size:11.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase">
      ${esc(S.findings?.company || "—")} · ${h.people ?? "—"} staff</div>
    <div class="meta" style="margin-left:auto">${esc(sweep || "NO SWEEP YET")}</div>
  </div>

  <h1 style="margin:26px 0 0;font-size:clamp(30px,3.9vw,55px);line-height:1.16;max-width:32ch;text-wrap:pretty">${headline()}</h1>

  <p style="margin:34px 0 0;font-size:19px;line-height:1.6;color:var(--muted);max-width:62ch">
    Every figure on this page was copied off a <span class="mono" style="font-size:.9em">.gov.sg</span> page.
    ${S.findings ? `${S.findings.parties - (S.findings.priced_in_prose ?? 0)} of the ${S.findings.parties} findings price themselves from your own payroll; the other ${S.findings.priced_in_prose} are priced in the human-written cost note on their rule, quoted rather than paraphrased.` : ""}
  </p>

  ${degraded ? `
  <div style="margin-top:44px;border-left:3px solid var(--line);padding:14px 0 14px 20px;color:var(--muted);max-width:66ch">
    <div class="lbl">Commentary unavailable</div>
    <div style="font-size:17px;line-height:1.6;margin-top:8px">
      ${esc(h.bedrock.detail)}. The board below is still complete and still correct —
      every figure came from the vault, not from a model. Only the written answer in
      <em>Ask Ante</em> needs credentials.</div>
  </div>` : ""}

  ${forced.length ? forceBanner(forced[0]) : ""}
  ${timeline(list)}
  ${findingsSection(list, shown)}
  ${curatorSection()}
  ${refusalsSection()}
  ${askSection()}
  ${uploadSection()}
  ${S.open ? drawer(S.open) : ""}`;

  wire();
}

function forceBanner(r) {
  const a = r.affected[0];
  return `
  <div style="margin-top:88px;background:var(--alarm-bg);padding:44px clamp(24px,4vw,56px) 48px;border-top:3px solid var(--alarm)">
    <div style="display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline">
      <div class="kick" style="color:var(--alarm-ink)">Already in force · unbudgeted</div>
      <div class="mono" style="font-size:12px;letter-spacing:.08em;color:var(--alarm-deep)">
        EFFECTIVE ${shortDate(r.lands)} · ${Math.abs(r.days_until)} DAYS AGO</div>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,.85fr);gap:20px 64px;margin-top:26px;align-items:start">
      <div>
        <div style="font-size:clamp(24px,2.4vw,33px);line-height:1.24;max-width:34ch;text-wrap:pretty">${esc(r.title)}</div>
        <p style="margin:22px 0 0;font-size:18px;line-height:1.62;color:var(--muted);max-width:56ch">
          ${esc(r.consequence)} No calendar app can show this: the date is in the past.</p>
        <div class="mono" style="margin-top:28px;font-size:12.5px;color:var(--ink);line-height:1.9">
          DO THIS NEXT &nbsp;→&nbsp; ${esc(firstSentence(r.next))}</div>
      </div>
      <div style="text-align:right">
        <div class="mono" style="font-size:${bannerFig(r).size};line-height:1.05;letter-spacing:-.02em;color:var(--alarm-ink)">${esc(bannerFig(r).big)}</div>
        <div class="mono" style="font-size:11.5px;letter-spacing:.14em;color:var(--alarm-deep);margin-top:10px;text-transform:uppercase">${esc(bannerFig(r).note)}</div>
        <div style="font-size:16.5px;line-height:1.6;color:var(--muted);margin-top:20px;font-style:italic">
          ${r.gap ? "Arithmetic over two figures the vault holds: the salary, and the floor it must clear."
                  : "Quoted from the rule's cost note. Ante does not derive a rate it cannot read off the page."}</div>
        <div class="mono" style="margin-top:18px;font-size:12px">
          <a href="${esc(r.resource)}" target="_blank" rel="noopener">${esc(host(r.resource))} ↗</a></div>
      </div>
    </div>
  </div>`;
}
const firstSentence = t => (t || "").split(/(?<=\.)\s/)[0] || "read the rule note";

/* The banner is the loudest thing on the page, so its number has to mean
   something. Four of six rules have no computable gap -- their cost lives in
   human prose -- and setting the word "quoted" in 46px pink would be the
   loudest empty statement on the board. Fall back to the move that actually
   happened, then to the headcount, before ever shouting a placeholder. */
function bannerFig(r) {
  if (r.gap) return { big: money(r.gap), note: r.figureNote, size: "clamp(30px,3.4vw,46px)" };
  const sgd = r.unit && r.unit.startsWith("SGD");
  if (r.threshold_before != null && r.threshold_after != null) {
    const f = v => sgd ? money(v) : `${v}${UNIT[r.unit] || ""}`;
    return { big: `${f(r.threshold_before)} → ${f(r.threshold_after)}`,
             note: "the move, off the government page", size: "clamp(20px,2.1vw,29px)" };
  }
  const n = r.affected.length;
  return { big: `${n} ${n === 1 ? "party" : "parties"}`,
           note: "affected · priced in the rule note", size: "clamp(26px,2.8vw,38px)" };
}

/* Eighteen months, with today as the line. Everything left of it is in force
   and unbudgeted — the category a calendar structurally cannot show. */
function timeline(list) {
  const dated = list.filter(r => r.days_until != null);
  const standing = list.filter(r => r.days_until == null);
  if (!dated.length) return "";
  const lo = Math.min(-30, ...dated.map(r => r.days_until)) - 40;
  const hi = Math.max(30, ...dated.map(r => r.days_until)) + 40;
  const pos = d => ((d - lo) / (hi - lo)) * 100;
  const groups = {};
  dated.forEach(r => (groups[r.lands] ||= []).push(r));
  // stagger anything that would collide: two dates 60 days apart sit close
  // enough that their captions overlap and both become unreadable
  let prev = -99;
  const marks = Object.entries(groups)
    .sort((a, b) => groups[a[0]][0].days_until - groups[b[0]][0].days_until)
    .map(([lands, rs]) => {
      const r = rs[0], left = pos(r.days_until), inF = r.in_force;
      const tight = left - prev < 17;
      prev = left;
      const label = rs.length > 1 ? `${r.when} ×${rs.length}` : r.when;
      const names = rs.map(x => shortTitle(x.title)).join(" · ");
      return `
      <div style="position:absolute;left:${left}%;top:74px;width:${rs.length > 1 ? 13 : 9}px;height:${rs.length > 1 ? 13 : 9}px;background:${inF ? "var(--alarm)" : "var(--ink)"};transform:translate(-50%,-50%)"></div>
      <div style="position:absolute;left:${left}%;top:${tight ? 4 : 32}px;transform:translateX(-50%);text-align:center;white-space:nowrap">
        <div class="mono" style="font-size:13px;color:${inF ? "var(--alarm-ink)" : "var(--ink)"}">${esc(label)}</div>
        <div class="mono" style="font-size:10.5px;letter-spacing:.1em;color:${inF ? "var(--alarm-deep)" : "var(--faint)"};margin-top:4px">${shortDate(lands)}</div>
      </div>
      <div style="position:absolute;left:${left}%;top:${tight ? 118 : 92}px;transform:translateX(-50%);width:${tight ? 150 : 180}px;text-align:center;font-size:14.5px;color:var(--muted);line-height:1.4">${esc(names)}</div>`;
    }).join("");
  return `
  <div class="sec" style="margin-top:104px">
    <div style="display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline">
      <h2>Eighteen months</h2>
      <div class="lede">Everything left of the line is in force already.</div>
    </div>
    <div style="position:relative;height:190px;margin-top:52px">
      <div style="position:absolute;left:0;top:0;bottom:0;width:${pos(0)}%;background:var(--alarm-bg)"></div>
      <div style="position:absolute;left:0;right:0;top:74px;height:1px;background:var(--line)"></div>
      <div style="position:absolute;left:${pos(0)}%;top:0;bottom:22px;width:2px;background:var(--ink)"></div>
      <div class="mono" style="position:absolute;left:${pos(0)}%;top:-4px;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;white-space:nowrap">TODAY</div>
      ${marks}
    </div>
    ${standing.length ? `<div class="meta" style="margin-top:18px;text-transform:uppercase">${esc(standing.map(r => shortTitle(r.title)).join(" · "))} — a standing threshold. It has no date, it has a line you cross</div>` : ""}
  </div>`;
}

function findingsSection(list, shown) {
  const counts = {
    all: list.length, force: list.filter(r => r.in_force).length,
    law: list.filter(r => r.clock === "law").length,
    growth: list.filter(r => r.clock === "growth").length,
    recurring: list.filter(r => r.clock === "recurring").length,
  };
  const filters = [["all", "All"], ["force", "In force"], ["law", "Law moved"],
                   ["growth", "You grew"], ["recurring", "Date arriving"]]
    .filter(([id]) => counts[id]).map(([id, label]) =>
      `<button class="chip" data-filter="${id}" aria-pressed="${S.filter === id}">${label} ${counts[id]}</button>`).join("");

  return `
  <div class="sec">
    <div class="sechead">
      <h2>${list.length} finding${list.length === 1 ? "" : "s"}, ranked by when they bite</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${filters}</div>
    </div>
    <div style="margin-top:34px">
      ${shown.map(finding).join("")}
      <div style="border-top:1px solid var(--line);padding-top:22px;font-size:17px;color:var(--muted);max-width:64ch;font-style:italic;text-wrap:pretty">
        ${S.filter === "all"

function detail(r, a) {
  const sgd = r.unit && r.unit.startsWith("SGD");
  const v = sgd ? money(a.value) : a.value;
  const t = sgd ? money(r.threshold_after) : r.threshold_after;
  const u = UNIT[r.unit] || "";
  const bits = [`${v}${u} vs ${t}${u} ${r.bites === "above" ? "ceiling" : "threshold"}`];
  if (a.annual_gap) bits.push(`${money(a.annual_gap)}/yr gap`);
  return bits.join(" · ");
}

/* ---------------------------------------------------------------- events */
function wire() {
  document.querySelectorAll("[data-filter]").forEach(b =>
    b.onclick = () => { S.filter = b.dataset.filter === S.filter ? "all" : b.dataset.filter; render(); });

  document.querySelectorAll("[data-open]").forEach(b =>
    b.onclick = async () => { S.open = await api(`/api/rule/${b.dataset.open}`); render(); });

  document.querySelectorAll("[data-close]").forEach(b =>
    b.onclick = () => { S.open = null; render(); });

  document.querySelectorAll("[data-copy]").forEach(b =>
    b.onclick = () => {
      const r = rows().find(x => x.slug === b.dataset.copy);
      const text = [r.title,
        `Lands: ${r.when}${r.in_force ? " (ALREADY IN FORCE)" : ""}`,
        `Affected: ${r.affected.map(a => `${a.who}, ${detail(r, a)}`).join("; ")}`,
        "", "Cost:", r.cost, "", "Next step:", r.next, "", `Source: ${r.resource}`].join("\n");
      navigator.clipboard?.writeText(text).then(() => {
        b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy to your accountant"), 1600);
      }).catch(() => {});
    });

  document.querySelectorAll("[data-q]").forEach(b =>
    b.onclick = () => { $("#q").value = b.dataset.q; ask(); });
  const askbtn = $("#askbtn"); if (askbtn) askbtn.onclick = ask;
  const q = $("#q"); if (q) q.onkeydown = e => { if (e.key === "Enter") ask(); };

  const undo = document.querySelector("[data-undo]");
  if (undo) undo.onclick = async () => {
    undo.disabled = true; undo.textContent = "Restoring…";
    try { await api(`/api/rollback/${undo.dataset.undo}`, { method: "POST" }); await boot(); }
    catch (e) { undo.textContent = e.message || "Could not undo"; }
  };

  const csv = $("#csv"), drop = $("#drop");
  if (csv) csv.onchange = () => { $("#dropname").textContent = (csv.files[0]?.name || "DROP PAYROLL.CSV HERE").toUpperCase(); };
  if (drop) {
    drop.ondragover = e => { e.preventDefault(); drop.style.borderColor = "var(--cyan)"; };
    drop.ondragleave = () => (drop.style.borderColor = "#bab6b6");
    drop.ondrop = e => {
      e.preventDefault(); drop.style.borderColor = "#bab6b6";
      csv.files = e.dataTransfer.files;
      $("#dropname").textContent = (csv.files[0]?.name || "").toUpperCase();
    };
  }
  const build = $("#build"); if (build) build.onclick = upload;
}

async function ask() {
  const q = $("#q");
  const question = (q.value || q.placeholder).trim();
  if (!question || S.asking) return;
  S.asking = true; render();
  try {
    S.asked = await api("/api/ask", { method: "POST", body: new URLSearchParams({ question }) });
  } catch (e) {
    S.asked = { answer: e.body?.detail || e.message, metrics: {}, turns: 0 };
  }
  S.asking = false; render();
}

async function upload() {
  const file = $("#csv").files[0];
  if (!file) { S.upload = { error: "Choose a payroll CSV first." }; return render(); }
  const fd = new FormData();
  fd.append("payroll", file);
  FIELDS.forEach(([k]) => fd.append(k, document.querySelector(`[name="${k}"]`).value.trim()));
  fd.append("replace", $("#replace").checked);
  const map = {};
  document.querySelectorAll("[data-map]").forEach(s => { if (s.value) map[s.dataset.map] = s.value; });
  if (Object.keys(map).length) fd.append("mapping", JSON.stringify(map));

  S.busy = "upload"; render();
  try { S.upload = await api("/api/upload", { method: "POST", body: fd }); }
  catch (e) { S.upload = { error: e.body?.detail?.[0]?.msg || e.message }; }
  S.busy = ""; render();
  if (S.upload?.people) await boot();
}

/* ---------------------------------------------------------------- boot */
async function boot() {
  const [health, findings, rules, alerts] = await Promise.all(
    ["/api/health", "/api/findings", "/api/rules", "/api/alerts"].map(u => api(u).catch(() => null)));
  Object.assign(S, { health, findings, rules, alerts });

  // the most recently auto-applied rule, if any -- drives the curator diff
  const applied = (rules?.rules || []).filter(r => r.last_change && r.last_change !== "None")
    .sort((a, b) => String(b.last_change).localeCompare(String(a.last_change)))[0];
  S.changed = applied ? await api(`/api/history/${applied.slug}`).catch(() => null) : null;
  if (S.changed) S.changed.slug = applied.slug;

  render();
}

boot().catch(e => {
  $("#app").innerHTML = `<div style="padding:120px 0;max-width:60ch">
